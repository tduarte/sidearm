# sidearm — self-hosted CS2 server + admin panel.
#
# First-run:
#   cp .env.example .env  # then fill in GSLT and passwords
#   docker compose up -d
# The CS2 game files (~40 GB) download into the `cs2-data` volume on first
# boot; be patient. Panel UI lives at http://<host>:3000.
#
# The panel talks to Docker through `docker-proxy` (tecnativa/docker-socket-proxy)
# so we never give it the raw socket.

services:
  cs2:
    # The upstream CS2 image plus pinned Metamod / CounterStrikeSharp / MatchZy.
    #
    # Published, so a first install pulls rather than building — the build
    # fetches from mms.alliedmods.net and two GitHub release URLs, and a new
    # user's install should not fail because one of those is down. With both
    # `image` and `build` set, compose pulls when the tag exists and falls back
    # to building when it does not, so `docker compose up` works either way.
    #
    # Rebuilding or re-pulling this recreates the container and drops everyone
    # connected, so `scripts/deploy-lxc.sh` does NOT touch it during a routine
    # panel deploy — pass --with-cs2 deliberately, on an empty server.
    image: ghcr.io/tduarte/sidearm-cs2:latest
    build:
      context: ./docker/cs2
    container_name: cs2
    restart: unless-stopped
    environment:
      SRCDS_TOKEN: ${GSLT}
      CS2_SERVERNAME: ${SERVER_NAME:-sidearm}
      CS2_PW: ${SERVER_PASSWORD:-}
      CS2_RCONPW: ${RCON_PASSWORD}
      # 11, not 10: GOTV occupies a slot (see TV_ENABLE below), so a 10-slot
      # server only fits nine people and a 5v5 will not start.
      CS2_MAXPLAYERS: ${CS2_MAXPLAYERS:-11}
      CS2_GAMETYPE: ${CS2_GAMETYPE:-0}
      CS2_GAMEMODE: ${CS2_GAMEMODE:-1}
      CS2_MAPGROUP: ${CS2_MAPGROUP:-mg_active}
      CS2_STARTMAP: ${CS2_STARTMAP:-de_mirage}
      CS2_PORT: "27015"
      # GOTV. The image defaults TV_ENABLE to 0, so 27020/udp below was
      # published with nothing listening on it and demo recording could not
      # work. These are launch arguments: changing them needs
      # `docker compose up -d --force-recreate cs2`.
      TV_ENABLE: ${TV_ENABLE:-1}
      TV_PORT: "27020"
      TV_AUTORECORD: ${TV_AUTORECORD:-0}
      TV_PW: ${TV_PW:-}
      TV_RELAY_PW: ${TV_RELAY_PW:-}
      # Seconds of broadcast delay. The image ships 0, which lets anyone
      # watching GOTV see the game live and call positions.
      TV_DELAY: ${TV_DELAY:-30}
      TV_MAXRATE: ${TV_MAXRATE:-0}
    volumes:
      - cs2-data:/home/steam/cs2-dedicated
    ports:
      - "27015:27015/udp"
      # RCON (27015/tcp) is deliberately NOT published: it lives only on the
      # internal compose network between the panel and CS2.
      - "27020:27020/udp"
    networks: [panel-net]
    healthcheck:
      # Probes RCON's TCP port with bash's /dev/tcp, because the image ships
      # neither nc nor curl -- the previous `nc -z -u` exited 127 on every run,
      # so the container was permanently unhealthy. TCP is also the only honest
      # signal here: `nc -z -u` cannot tell an open UDP port from a silent one.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27015"]
      interval: 30s
      timeout: 5s
      retries: 6

  panel:
    # Pre-built image by default; `docker compose up --build` uses local source.
    image: ghcr.io/tduarte/sidearm:latest
    build:
      context: .
    container_name: sidearm-panel
    restart: unless-stopped
    depends_on:
      - cs2
      - docker-proxy
    environment:
      API_MODE: real
      BIND_HOST: 0.0.0.0
      PORT: "3000"
      RCON_HOST: cs2
      RCON_PORT: "27015"
      RCON_PASSWORD: ${RCON_PASSWORD}
      # Must match the `docker-proxy` service name.
      DOCKER_HOST_ADDR: docker-proxy
      DOCKER_PORT: "2375"
      # Embedded in the logaddress_add_http URL the panel sets on CS2.
      LOG_INGEST_SECRET: ${LOG_INGEST_SECRET}
      # Embedded in the matchzy_loadmatch_url the panel gives CS2. Falls back to
      # LOG_INGEST_SECRET when empty, so leaving it blank is fine — but it has
      # to be passed through, or setting it in .env would silently do nothing.
      MATCHZY_CONFIG_SECRET: ${MATCHZY_CONFIG_SECRET:-}
      # Empty = panel is open on the LAN. Set it to require a bearer token
      # on /api/* and /ws.
      PANEL_ADMIN_TOKEN: ${PANEL_ADMIN_TOKEN:-}
      # CIDRs allowed to skip the token. Empty = everyone authenticates.
      PANEL_TRUSTED_CIDRS: ${PANEL_TRUSTED_CIDRS:-}
      # Set to 1 only when serving the panel over HTTPS.
      PANEL_HTTPS: ${PANEL_HTTPS:-}
      # Public address for the connect URL. Set it to skip an outbound
      # api.ipify.org lookup.
      SERVER_IP: ${SERVER_IP:-}
      # Set to 1 to let the panel restart `cs2` by itself when a game update is
      # pending AND nobody is connected. Unset = surface the badge only.
      CS2_AUTO_UPDATE: ${CS2_AUTO_UPDATE:-}
      # How often to ask Steam whether the running build is current. 0 disables.
      CS2_UPDATE_CHECK_MS: ${CS2_UPDATE_CHECK_MS:-900000}
      SQLITE_PATH: /data/sidearm.db
    volumes:
      - panel-data:/data
      # Read-only: lets the panel list and serve recorded demos, which are
      # written inside the CS2 volume and otherwise have no way out. Read-only
      # so the panel cannot touch the 70 GB of game files it is looking at.
      - cs2-data:/cs2:ro
    ports:
      - "3000:3000"
    networks: [panel-net]
    labels:
      # Picked up only when the `autoupdate` profile is running.
      com.centurylinklabs.watchtower.enable: "true"

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: sidearm-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "1"
      # Leave everything else at default (0) to minimise attack surface.
    # SELinux (Fedora/RHEL/CentOS, enforcing by default) denies a confined
    # container write access to the Docker socket, so haproxy cannot reach its
    # backend and every request 503s — the panel then shows no CPU/memory and
    # cannot start/stop the container. Disabling the label for THIS container
    # only is the standard fix; the proxy still enforces its own endpoint
    # allowlist below. No-op on non-SELinux hosts.
    security_opt:
      - label:disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [panel-net]

  # Container *image* updates — a different thing from CS2 game updates, which
  # the panel handles itself (see CS2_AUTO_UPDATE above). Watchtower only
  # refreshes the images in this file; it does not patch Counter-Strike.
  #
  # Opt in explicitly, because unlike `panel` this needs the raw socket
  # read-write plus image-pull rights, which is root-equivalent on the host:
  #
  #   docker compose --profile autoupdate up -d
  #
  # containrrr/watchtower was archived in December 2025; this is the maintained
  # community fork. Only services carrying the label below are touched — `cs2`
  # is left out on purpose so a wrapper-image bump cannot recreate the container
  # mid-match.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: sidearm-watchtower
    restart: unless-stopped
    profiles: ["autoupdate"]
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      # 6-field cron (seconds first): 04:00 daily.
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [panel-net]

volumes:
  cs2-data:
  panel-data:

networks:
  panel-net:
    driver: bridge
