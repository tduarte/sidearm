name: Build & publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Decides whether either Docker image could possibly have changed, so a docs- or
  # compose-only PR does not spend two minutes rebuilding a byte-identical image.
  #
  # Two images, two answers: `image` is the panel (built from the repo root),
  # `cs2` is the dedicated-server wrapper in docker/cs2. They move independently
  # -- a plugin bump is nothing to the panel, and a React change is nothing to
  # the game server.
  #
  # The panel filter is deliberately a DENYLIST: anything not matched below
  # counts as image-relevant. A path nobody thought about therefore still
  # triggers a build, which wastes CPU; an allowlist would silently skip it and
  # publish a stale image. Wrong in the cheap direction on purpose.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      cs2: ${{ steps.filter.outputs.cs2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect image-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          # A release tag always rebuilds, whatever it points at.
          if [ "$REF_TYPE" = "tag" ]; then
            echo "tag push - building"
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "cs2=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q --no-tags origin "$BASE_REF"
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "${BEFORE:-}" ] && git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            files=$(git diff --name-only "$BEFORE" HEAD)
          else
            files=""
          fi

          # No diff we can trust (first push, force-push, unknown base): build.
          if [ -z "$files" ]; then
            echo "could not determine changed files - building to be safe"
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "cs2=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"
          echo "$files" | sed 's/^/  /'

          # None of these end up in the panel runtime image. The Dockerfile
          # copies only .next, public, app, components, hooks, lib, server.ts and
          # the config and manifest files, so tests and scripts cannot alter it
          # -- and a type error in a test is still caught by `verify`, which
          # always runs. docker/ is the CS2 wrapper, handled separately below.
          # .github/ is absent on purpose: changing CI should revalidate the build.
          IGNORED='(\.md$|^docker-compose[^/]*\.ya?ml$|^\.env\.example$|^scripts/|^test/|^docker/|^\.gitignore$|^LICENSE$)'

          relevant=$(echo "$files" | grep -vE "$IGNORED" || true)

          if [ -n "$relevant" ]; then
            echo "panel-image-relevant changes:"
            echo "$relevant" | sed 's/^/  /'
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "no panel-image-relevant changes - skipping that Docker build"
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

          # The CS2 wrapper is a small, self-contained context, so an ALLOWLIST
          # is safe here in a way it is not for the panel: build.yml aside,
          # nothing outside docker/cs2 can reach that image. The pinned plugin
          # versions live in its Dockerfile, so a version bump lands here and
          # gets its download URLs proved before anyone recreates a live server.
          cs2_relevant=$(echo "$files" | grep -E '^docker/cs2/' || true)

          if [ -n "$cs2_relevant" ]; then
            echo "cs2-image-relevant changes:"
            echo "$cs2_relevant" | sed 's/^/  /'
            echo "cs2=true" >> "$GITHUB_OUTPUT"
          else
            echo "no cs2-image-relevant changes - skipping that Docker build"
            echo "cs2=false" >> "$GITHUB_OUTPUT"
          fi

  # The compose files and setup script are the interface for anyone who is not
  # us: a user's whole experience is `./scripts/setup.sh && docker compose up`.
  # A YAML error or a shell typo there is a broken install for everyone, and
  # `verify` cannot catch it — tsc and eslint never read these files.
  #
  # Fast (no image pulls), so it runs on every push regardless of what changed.
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -euo pipefail
          for f in scripts/*.sh docker/cs2/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      # `docker compose config` resolves every variable, so an unquoted value or
      # a bad interpolation fails here rather than on someone's server. The
      # runner ships the compose plugin already.
      - name: Compose files resolve
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          echo "ok  docker-compose.yml"
          docker compose -f docker-compose.dev.yml config -q
          echo "ok  docker-compose.dev.yml"

      # The quick start people copy is three commands. This runs the awkward one
      # end to end, non-interactively, and checks it produced something bootable
      # — the failure it guards against is a setup script that writes a .env the
      # compose file then rejects.
      - name: setup.sh writes a usable .env
        run: |
          set -euo pipefail
          rm -f .env
          printf 'ci-server\n\n11\ny\n' | ./scripts/setup.sh

          test -f .env
          [ "$(stat -c '%a' .env)" = "600" ] || { echo ".env must be chmod 600"; exit 1; }

          # Every secret present, and distinct: a shared default would mean every
          # install that skipped setup has the same RCON password.
          rcon=$(sed -n 's/^RCON_PASSWORD=//p' .env)
          ingest=$(sed -n 's/^LOG_INGEST_SECRET=//p' .env)
          token=$(sed -n 's/^PANEL_ADMIN_TOKEN=//p' .env)
          for v in "$rcon" "$ingest" "$token"; do
            [ ${#v} -ge 32 ] || { echo "a generated secret is too short"; exit 1; }
          done
          [ "$rcon" != "$ingest" ] || { echo "secrets must differ"; exit 1; }

          [ "$(sed -n 's/^SERVER_NAME=//p' .env)" = "ci-server" ] || {
            echo "answers were not written through"; exit 1; }

          # The point of the whole thing: compose has to accept what it wrote.
          docker compose config -q
          echo "ok  setup.sh -> docker compose config"

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

  build:
    needs: [verify, changes]
    # Skipped (not failed) when nothing touched the image; a skipped job still
    # satisfies a required status check, should one ever be configured.
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The CS2 wrapper: BUILT, never PUSHED.
  #
  # Deliberate. AGENTS.md forbids `docker compose pull` on the server because it
  # would replace a locally built image with CI's, and the compose file names
  # this one `sidearm/cs2:latest` -- an unqualified tag with no registry, so it
  # can only ever come from a local build. Publishing it would create exactly the
  # substitute that rule exists to prevent.
  #
  # What CI is for here is the failure this image can have that the panel cannot:
  # the pinned Metamod / CounterStrikeSharp / MatchZy URLs are fetched at build
  # time and upstream deletes old releases. A bump that 404s should fail in a PR,
  # not at 9pm on a server that has just dropped ten players to recreate.
  build-cs2:
    needs: [changes]
    if: needs.changes.outputs.cs2 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the CS2 wrapper image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/cs2
          push: false
          # Loaded into the local daemon so the step below can actually look
          # inside it; without this the build stays in buildx's cache and
          # `docker run` would fail on an unknown image.
          load: true
          tags: sidearm/cs2:ci
          cache-from: type=gha,scope=cs2
          cache-to: type=gha,mode=max,scope=cs2

      # Proves the three archives actually unpacked where the boot-time
      # installer looks for them -- a `curl | tar` that silently produced an
      # empty tree would otherwise build green and fail on the server.
      - name: Check the image carries what the installer expects
        run: |
          docker run --rm --entrypoint sh sidearm/cs2:ci -c '
            set -eu
            cat /opt/sidearm/plugins/.version
            test -d /opt/sidearm/plugins/addons/metamod
            test -d /opt/sidearm/plugins/addons/counterstrikesharp
            # The one file that makes Metamod load CounterStrikeSharp, and the
            # one the stacking order could plausibly lose: it ships inside the
            # CSSharp archive under addons/metamod/, a directory the Metamod
            # tarball also creates.
            # (No apostrophes in here: this whole block is a single-quoted
            # `sh -c` argument, and one would close the quote and mangle the
            # rest of the script. That is exactly how this first went red.)
            test -f /opt/sidearm/plugins/addons/metamod/counterstrikesharp.vdf
            test -f /opt/sidearm/plugins/addons/counterstrikesharp/plugins/MatchZy/MatchZy.dll
            test -x /opt/sidearm/install-plugins.sh
            test -x /opt/sidearm/entrypoint.sh
          '
