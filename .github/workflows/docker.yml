name: Build & publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Decides whether the Docker image could possibly have changed, so a docs- or
  # compose-only PR does not spend two minutes rebuilding a byte-identical image.
  #
  # Deliberately a DENYLIST: anything not matched below counts as image-relevant.
  # A path nobody thought about therefore still triggers a build, which wastes
  # CPU; an allowlist would silently skip it and publish a stale image. Wrong in
  # the cheap direction on purpose.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect image-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          # A release tag always rebuilds, whatever it points at.
          if [ "$REF_TYPE" = "tag" ]; then
            echo "tag push - building"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q --no-tags origin "$BASE_REF"
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "${BEFORE:-}" ] && git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            files=$(git diff --name-only "$BEFORE" HEAD)
          else
            files=""
          fi

          # No diff we can trust (first push, force-push, unknown base): build.
          if [ -z "$files" ]; then
            echo "could not determine changed files - building to be safe"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"
          echo "$files" | sed 's/^/  /'

          # None of these end up in the runtime image. The Dockerfile copies only
          # .next, public, app, components, hooks, lib, server.ts and the config
          # and manifest files, so tests and scripts cannot alter it -- and a type
          # error in a test is still caught by `verify`, which always runs.
          # .github/ is absent on purpose: changing CI should revalidate the build.
          IGNORED='(\.md$|^docker-compose[^/]*\.ya?ml$|^\.env\.example$|^scripts/|^test/|^\.gitignore$|^LICENSE$)'

          relevant=$(echo "$files" | grep -vE "$IGNORED" || true)

          if [ -n "$relevant" ]; then
            echo "image-relevant changes:"
            echo "$relevant" | sed 's/^/  /'
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "no image-relevant changes - skipping the Docker build"
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

  build:
    needs: [verify, changes]
    # Skipped (not failed) when nothing touched the image; a skipped job still
    # satisfies a required status check, should one ever be configured.
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
